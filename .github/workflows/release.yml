name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            binary: reversedrop-linux-amd64
          - os: linux
            goos: linux
            goarch: arm64
            binary: reversedrop-linux-arm64
          - os: macos
            goos: darwin
            goarch: amd64
            binary: reversedrop-darwin-amd64
          - os: macos
            goos: darwin
            goarch: arm64
            binary: reversedrop-darwin-arm64
          - os: windows
            goos: windows
            goarch: amd64
            binary: reversedrop-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build CLI
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ${{ matrix.binary }} ./cmd/reversedrop
      - name: Build GUI
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          sudo apt-get update && sudo apt-get install -y libgl-dev xorg-dev pkg-config
          go build -o reversedrop-gui-linux-amd64 ./gui
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        with:
          name: reversedrop-gui-linux-amd64
          path: reversedrop-gui-linux-amd64

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
